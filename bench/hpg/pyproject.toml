[project]
name = "hpg-serving-env"
version = "0.1.0"
description = "Locked vLLM serving environment and benchmark client for single-GPU HiPerGator jobs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vllm==0.26.0",
  "transformers==5.14.1",
  "httpx==0.28.1",
]

[tool.uv]
# One environment per serving stack. Resolve for the Linux x86_64 cluster only, so the lock holds
# the wheels the nodes install and nothing else.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
package = false
