name: Native HTTP ticket service

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ticket-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q tests/test_ticket_service.py tests/test_aae_ticket.py --junitxml=ticket-service-tests.xml
      - run: python examples/ticket_service_demo.py ./ticket-service-run
      - run: python examples/aae_ticket_demo.py ./aae-ticket-run --source-revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ticket-service-run
          path: |
            ticket-service-run/
            aae-ticket-run/
            ticket-service-tests.xml
