name: Done gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  done:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the package with the done extra (builds jcs-admit from its pinned commit)
        run: python -m pip install -e '.[test,done,witness,cover]'
      - name: Contract, held-out, mutant, grading, receipt, policy and command-line tests
        run: python -m coverage run --parallel-mode --source=probity_observer.done -m pytest -q -p no:cacheprovider tests/done
      - name: Combine the suite's data with the data of the test runs it started
        run: python -m coverage combine
      - name: Every done module is at least 80 percent covered
        run: python -m coverage report --show-missing && python scripts/check-done-coverage.py
